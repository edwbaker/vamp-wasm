name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: emscripten-core/setup-emsdk@v16

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build host and example plugins
        run: make host plugins

      - name: Fetch ecoacoustic plugins (latest vamp-ecoacoustics release)
        run: gh release download -R edwbaker/vamp-ecoacoustics -p vamp-ecoacoustics.wasm -D dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Smoke test
        run: node test.js

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/vamp-host.js
            dist/vamp-host.wasm
            dist/vamp-example-plugins.so
            dist/vamp-ecoacoustics.wasm

  release:
    name: GitHub release and npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg"
            exit 1
          fi

      - name: Zip release files
        run: |
          cd dist
          zip "../vamp-wasm-${GITHUB_REF_NAME}.zip" vamp-host.js vamp-host.wasm vamp-example-plugins.so
          zip -j "../vamp-wasm-${GITHUB_REF_NAME}.zip" ../src/vamp-multi-host.js

      - uses: softprops/action-gh-release@v3
        with:
          files: vamp-wasm-*.zip
          generate_release_notes: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) with staged publishing: no token is stored, and a maintainer
      # approves each version with 2FA (npm stage approve, or the Staged Packages tab on npmjs.com).
      # Needs npm 11.15.0 or later.
      - name: Stage npm publish
        run: |
          npm install -g npm@latest
          npm stage publish

  pages:
    name: Deploy web demo
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: site/dist

      - name: Assemble site
        run: |
          cp -r examples site/examples
          mkdir -p site/src
          cp src/vamp-multi-host.js site/src/
          echo '<meta http-equiv="refresh" content="0; url=examples/web-demo/">' > site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
